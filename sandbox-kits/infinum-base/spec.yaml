schemaVersion: "2"
kind: mixin
name: infinum-base
displayName: Infinum Base — Attribution & Maven Central
description: >-
  The Infinum baseline for a Claude sandbox: removes Claude Code's
  "🤖 Generated with Claude Code" commit trailer and "Co-Authored-By: Claude"
  line, and allows egress to Maven Central so JVM build tools can resolve
  dependencies. Consolidates the claude-no-attribution and maven-central kits.
requires:
  agent: claude

# Neither host redirects to a CDN, so these two are sufficient. See README for
# what is deliberately left out.
permissions:
  network:
    allow:
      - repo.maven.apache.org  # canonical host: Maven's `central`, Gradle's mavenCentral()
      - repo1.maven.org        # legacy hostname: sbt, Coursier, Leiningen, older configs

setup:
  install:
    - user: "1000"  # everything written lives under the agent's own ~/.claude
      description: Set attribution.commit and attribution.pr to "" in ~/.claude/settings.json to disable Claude's commit/PR attribution.
      command: |
        set -eu
        f=/home/agent/.claude/settings.json
        mkdir -p "$(dirname "$f")"
        # -s, not -f: a zero-byte settings.json passes -f, and `jq` on empty
        # input exits 0 with empty output, so the write below would replace the
        # file with a bare newline and still report success.
        [ -s "$f" ] || echo '{}' > "$f"
        # Capture before writing: a jq failure aborts before "$f" is touched,
        # and writing in place keeps the file's own mode and owner.
        merged=$(jq '.attribution.commit = "" | .attribution.pr = ""' "$f")
        printf '%s\n' "$merged" > "$f"

agentInstructions:
  content: |
    ## Commit & PR attribution disabled

    This sandbox sets `attribution.commit` and `attribution.pr` to empty
    strings in `~/.claude/settings.json`. Commits and pull requests you
    create will not include the "🤖 Generated with Claude Code" trailer or
    the "Co-Authored-By: Claude" line.

    ## Maven Central reachable

    This sandbox allows egress to `repo.maven.apache.org` and
    `repo1.maven.org`, so Maven, Gradle, sbt and Coursier can resolve and
    download dependencies from Maven Central.

    Those two are the only hosts this kit contributes. It does not allow the
    Gradle Plugin Portal (`plugins.gradle.org`), Sonatype snapshot/staging
    repos, Maven Central *search* (`central.sonatype.com`, `search.maven.org`),
    or any private repository — which is not the same as those being blocked,
    since the effective policy also includes host and org rules. Check
    `sbx policy ls` rather than assuming either way.

    A build that fails with an HTTP 403 mentioning "Blocked by network policy"
    needs that host added to the sandbox policy, not a build-file change.
