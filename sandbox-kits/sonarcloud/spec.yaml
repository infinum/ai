schemaVersion: "2"
kind: mixin
name: sonarcloud
displayName: SonarQube Cloud — Code Quality MCP
description: >-
  Registers SonarSource's SonarQube MCP server with Claude Code at user scope,
  pointed at SonarQube Cloud, so the agent can query a project's real issues,
  security hotspots, quality gate and coverage. Needs SONARQUBE_TOKEN and
  SONARQUBE_ORG in the sandbox environment, plus docker on PATH.
requires:
  agent: claude

# A self-hosted SonarQube Server lives at a URL only the user knows, so it
# needs its own host adding. See README.
permissions:
  network:
    allow:
      - registry-1.docker.io              # pulling sonarsource/sonarqube-mcp from Docker Hub
      - auth.docker.io                    # ditto: token exchange
      - production.cloudflare.docker.com  # ditto: layer download
      - sonarcloud.io                     # the MCP server's own calls to the SonarQube Cloud API

setup:
  install:
    - user: "1000"  # everything written lives under the agent's own ~/.claude
      description: Register the sonarqube MCP server (Docker, SonarQube Cloud) with Claude Code at user scope. Fails the sandbox if docker is absent, the credentials are unset, or the registration errors.
      command: |
        set -eu

        NAME=sonarqube

        # Unlike `claude`, Docker is not guaranteed by the base agent, and this
        # server only runs as a container image.
        if ! command -v docker >/dev/null 2>&1; then
          cat >&2 <<EOF
        sonarcloud kit: ERROR: 'docker' not found on PATH.
          The sonarqube MCP server runs as a Docker image, so it cannot be registered here.
          Apply this kit to a sandbox with a reachable Docker daemon, drop the kit, or
          fork it for the standalone-JAR alternative — see README.
        EOF
          exit 1
        fi

        # Read from the environment, never hardcoded — same convention as
        # CONTEXT7_API_KEY in the context7 kit.
        if [ -z "${SONARQUBE_TOKEN:-}" ] || [ -z "${SONARQUBE_ORG:-}" ]; then
          cat >&2 <<EOF
        sonarcloud kit: ERROR: SONARQUBE_TOKEN and/or SONARQUBE_ORG is not set.
          Both are required — the MCP server authenticates every SonarQube Cloud call with them.
          Set the token as a sandbox secret and recreate:
            sbx secret set sonarqube --sandbox <sandbox> -t '<token>'
          or pass both in the creation environment:
            SONARQUBE_TOKEN=<token> SONARQUBE_ORG=<org-key> sbx run claude --kit ./sonarcloud/ <workspace>
          See README for where to generate the token and find the organization key.
        EOF
          exit 1
        fi

        # `claude mcp add` exits 1 with "already exists" on a re-run — that's
        # not a failure, just nothing left to do. It does NOT update an
        # already-registered entry's env vars, so rotating the token later
        # needs a manual `claude mcp remove sonarqube -s user` first.
        if out=$(claude mcp add "$NAME" -s user \
              --env SONARQUBE_TOKEN="${SONARQUBE_TOKEN}" \
              --env SONARQUBE_ORG="${SONARQUBE_ORG}" \
              -- docker run --init --pull=always -i --rm \
                -e SONARQUBE_TOKEN -e SONARQUBE_ORG sonarsource/sonarqube-mcp 2>&1); then
          echo "$out"
        elif echo "$out" | grep -q "already exists"; then
          echo "sonarcloud kit: MCP server '$NAME' already configured in user scope."
        else
          cat >&2 <<EOF
        sonarcloud kit: ERROR: could not register the '$NAME' MCP server.
          $out
          The README's "Credentials" section has the command to retry in here.
        EOF
          exit 1
        fi

agentInstructions:
  content: |
    ## SonarQube Cloud MCP available

    The `sonarqube` MCP server is registered at user scope, running
    SonarSource's official `sonarsource/sonarqube-mcp` Docker image against
    **SonarQube Cloud** (`sonarcloud.io`). Use it instead of guessing from a
    stale local scan when you need a project's actual code quality issues,
    security hotspots, quality gate status, coverage, or duplications — call
    its tools under the `sonarqube` namespace (e.g. search issues, get a
    quality gate's status, list security hotspots, fetch measures).

    Registration required `SONARQUBE_TOKEN` (a SonarQube Cloud token) and
    `SONARQUBE_ORG` (the organization key) in the sandbox environment, and
    `docker` on PATH. All three are mandatory: this kit fails sandbox creation
    when any of them is missing, so in a sandbox you are running in they were
    present and the server is registered.

    This is SonarQube **Cloud** only — it does not talk to a self-hosted
    SonarQube Server instance.

    Check registration with `claude mcp list` or `claude mcp get sonarqube`.
    Tool calls can still fail at runtime for reasons setup could not catch — a
    revoked or wrong-scope token, an organization key that doesn't match the
    token, or blocked egress to Docker Hub or `sonarcloud.io`. Check
    `sbx policy log` for the last of those; see README for the rest.
