# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin

# The kit's own release number. Bump it when the declarations change.
version: "2.0.0"
displayName: Infinum Full Setup
description: >-
  Baseline Infinum setup for a Claude sandbox: disables commit/PR
  attribution, allows Maven Central egress, installs the Infinum plugin
  marketplace, house rules and the Caliber plugin, and registers the
  context7 MCP server via OAuth login (Caliber's own MCP server signs in
  the same way). See README.

requires: ["claude", "deb/jq"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # marketplace clones and plugin installs
          - github.com
          - api.github.com
      runtime:
        allow:
          # claude.ai connectors
          - claude.ai
          # Maven, Gradle
          - repo.maven.apache.org
          - repo1.maven.org
          - build.shibboleth.net
          # git, `gh`, plugin marketplace auto-update
          - github.com
          - api.github.com
          # context7 MCP endpoint + OAuth backend, and the OAuth consent page
          - "*.context7.com"
          - context7.com
          # Caliber MCP server and its OAuth sign-in
          - app.caliberhq.io
          # AI Stats
          - otlp-gateway-prod-eu-west-2.grafana.net
          # security-check skill: registry and advisory lookups
          - api.deps.dev
          - pypi.org
          - crates.io
          - rubygems.org
          - api.osv.dev
          - rustsec.org
          - registry.npmjs.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - user: agent
          description: "git: map GitHub SSH remotes to https://github.com/ in ~/.gitconfig"
          command: |
            set -eu
            git config --global --replace-all url."https://github.com/".insteadOf git@github.com: '^git@github\.com:$'
            git config --global --replace-all url."https://github.com/".insteadOf ssh://git@ssh.github.com:443/ '^ssh://git@ssh\.github\.com:443/$'
            git config --global --replace-all url."https://github.com/".insteadOf ssh://git@github.com/ '^ssh://git@github\.com/$'
            git config --global --replace-all url."https://github.com/".insteadOf git+ssh://git@github.com/ '^git\+ssh://git@github\.com/$'

        - user: agent
          description: "attribution: set attribution.commit and attribution.pr to \"\" in ~/.claude/settings.json"
          command: |
            set -eu
            f="$HOME/.claude/settings.json"
            mkdir -p "$HOME/.claude"
            # jq exits 0 with empty output on a whitespace-only file, so reseed that too.
            [ -s "$f" ] && [ -n "$(tr -d '[:space:]' < "$f")" ] || echo '{}' > "$f"
            # A jq failure aborts before "$f" is touched; writing in place keeps its mode and owner.
            merged=$(jq '.attribution.commit = "" | .attribution.pr = ""' "$f")
            [ -n "$merged" ] || { echo "infinum-full kit: ERROR: jq produced no output for $f" >&2; exit 1; }
            printf '%s\n' "$merged" > "$f"
        # The proxy variables are for the git clone under `claude plugin marketplace add`.
        - user: agent
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: "plugins: register the infinum-ai and caliber marketplaces, install the Infinum and caliber plugins"
          command: |
            set -eu
            export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"

            # add_marketplace <repo> <name>
            add_marketplace() {
              if out=$(claude plugin marketplace add "$1" 2>&1); then
                echo "$out"
              elif echo "$out" | grep -qiE "already (on disk|installed|exists)"; then
                echo "infinum-full kit: marketplace '$2' already registered."
              else
                echo "infinum-full kit: ERROR: could not add the '$2' marketplace (network policy likely blocking github.com): $out" >&2
                exit 1
              fi
            }

            # install_plugins <marketplace> <plugin>...
            install_plugins() {
              m=$1; shift
              for p in "$@"; do
                if out=$(claude plugin install "$p@$m" 2>&1); then
                  echo "$out"
                elif echo "$out" | grep -qiE "already (on disk|installed|exists)"; then
                  echo "infinum-full kit: plugin '$p@$m' already installed."
                else
                  echo "infinum-full kit: ERROR: plugin '$p@$m' did not install: $out" >&2
                  exit 1
                fi
              done
            }

            # Also leaves the clone the house rules hook below reads.
            add_marketplace infinum/ai infinum-ai
            install_plugins infinum-ai create-prd pr-review-code-simplicity productive-debug setup-audit security-check

            add_marketplace infinum/caliber-plugin caliber
            install_plugins caliber caliber

        - user: agent
          description: "house rules: install the house rules from the infinum-ai marketplace into ~/.claude/infinum/"
          command: |
            set -eu

            CLAUDE_DIR="$HOME/.claude"
            CONFIG_DIR="$CLAUDE_DIR/infinum"
            REPO="infinum/ai"
            # Cloned by the plugins hook above, which must run first.
            MARKET_DIR="$CLAUDE_DIR/plugins/marketplaces/infinum-ai"

            mkdir -p "$CONFIG_DIR"

            # Top-level rules only. whoami.md is the user's own, so upstream never replaces it.
            rules_found=0
            for f in "$MARKET_DIR"/rules/*.md; do
              [ -f "$f" ] || continue
              case "${f##*/}" in README.md | whoami.md) continue ;; esac
              cp "$f" "$CONFIG_DIR/"
              rules_found=1
            done
            if [ "$rules_found" != 1 ]; then
              echo "infinum-full kit: ERROR: no house rules found under $MARKET_DIR/rules/ ($REPO's clone has no rules/*.md)" >&2
              exit 1
            fi

            if [ ! -f "$CONFIG_DIR/whoami.md" ]; then
              cat > "$CONFIG_DIR/whoami.md" <<'WHOAMI'
            # Who you're working with

            > Replace this with your name and role so Claude can calibrate
            > its responses. Example:
            >
            > "Senior backend engineer at Infinum, focused on payments.
            > Comfortable with Go and Postgres; new to the iOS codebase."
            WHOAMI
            fi

            # whoami first, then the other rules alphabetically.
            {
              echo "@$CONFIG_DIR/whoami.md"
              for f in "$CONFIG_DIR"/*.md; do
                [ -f "$f" ] || continue
                case "${f##*/}" in whoami.md | index.md) continue ;; esac
                echo "@$f"
              done
            } > "$CONFIG_DIR/index.md"

            # The leading newline keeps the import off the user's last line.
            grep -qsF "@$CONFIG_DIR/index.md" "$CLAUDE_DIR/CLAUDE.md" || {
              [ -s "$CLAUDE_DIR/CLAUDE.md" ] && printf '\n' >> "$CLAUDE_DIR/CLAUDE.md"
              printf '%s\n' "@$CONFIG_DIR/index.md  # managed by $REPO" >> "$CLAUDE_DIR/CLAUDE.md"
            }

        - user: agent
          description: "MCP servers: register the context7 MCP server (remote HTTP, OAuth) at user scope, print the Caliber and context7 login steps"
          command: |
            set -eu
            export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"

            NAME=context7
            URL=https://mcp.context7.com/mcp/oauth

            if out=$(claude mcp add --transport http "$NAME" "$URL" -s user 2>&1); then
              echo "$out"
            elif echo "$out" | grep -q "already exists"; then
              echo "infinum-full kit: MCP server '$NAME' already configured in user scope."
            else
              echo "infinum-full kit: ERROR: could not register the '$NAME' MCP server: $out" >&2
              exit 1
            fi

            cat >&2 <<EOF
            infinum-full kit: NOTE: the Caliber and context7 MCP servers sign in with
              OAuth. Finish both once, from inside this sandbox (add --no-browser when
              no browser is reachable):
                claude mcp login plugin:caliber:caliber
                claude mcp login $NAME
              Then run /caliber:setup once in each repository that should use Caliber.
            EOF

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./infinum-full-context.md
