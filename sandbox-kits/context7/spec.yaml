schemaVersion: "2"
kind: mixin
name: context7
displayName: Context7 — Up-to-Date Docs MCP
description: >-
  Registers Upstash's Context7 MCP server with Claude Code at user scope, so
  the agent can pull current, version-specific library documentation and code
  examples instead of relying on stale training data.
requires:
  agent: claude

permissions:
  network:
    allow:
      - mcp.context7.com  # the remote HTTP MCP endpoint; see README for the local-stdio alternative

setup:
  install:
    - user: "1000"  # everything written lives under the agent's own ~/.claude
      description: Register the context7 MCP server (remote HTTP) with Claude Code at user scope.
      command: |
        set -u

        # Exported so `claude` agrees with this script even if $HOME differs
        # from /home/agent.
        export CLAUDE_CONFIG_DIR="${CLAUDE_CONFIG_DIR:-/home/agent/.claude}"
        NAME=context7
        URL=https://mcp.context7.com/mcp

        # CONTEXT7_API_KEY is optional: Context7's remote endpoint works
        # anonymously on a shared rate limit. Set it in the sandbox environment
        # to register with a personal key's header instead, for a higher limit.
        set -- --transport http "$NAME" "$URL" -s user
        if [ -n "${CONTEXT7_API_KEY:-}" ]; then
          set -- "$@" --header "Authorization: Bearer ${CONTEXT7_API_KEY}"
        fi

        out=$(claude mcp add "$@" 2>&1)
        status=$?

        # `claude mcp add` exits 1 with "already exists" on a re-run — that's
        # not a failure, just nothing left to do. It does NOT update an
        # already-registered entry's header, so switching in a key later needs
        # a manual `claude mcp remove context7 -s user` first.
        if [ "$status" -eq 0 ]; then
          echo "$out"
        elif echo "$out" | grep -q "already exists"; then
          echo "context7 kit: MCP server '$NAME' already configured in user scope."
        else
          cat >&2 <<EOF
        context7 kit: WARN: could not register the '$NAME' MCP server.
          $out
          Retry in here: claude mcp add --transport http $NAME $URL -s user
        EOF
        fi

        exit 0

agentInstructions:
  content: |
    ## Context7 MCP available

    The `context7` MCP server is registered at user scope (remote HTTP,
    `https://mcp.context7.com/mcp`), and this sandbox allows egress to
    `mcp.context7.com`. It resolves library/framework names to current,
    version-specific documentation and code examples — use it instead of
    guessing from training data when you need up-to-date API details for a
    dependency (add "use context7" to a prompt, or call its tools directly:
    `resolve-library-id` then `get-library-docs`).

    Running anonymously shares a public rate limit. If `CONTEXT7_API_KEY` was
    set in the sandbox environment at creation time, this kit registered the
    server with that key's `Authorization: Bearer` header instead, for a
    higher limit — get a free key at context7.com/dashboard.

    Check registration with `claude mcp list` or `claude mcp get context7`. If
    it's missing, the registration failed at creation time — retry with
    `claude mcp add --transport http context7 https://mcp.context7.com/mcp -s user`.
