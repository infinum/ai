schemaVersion: "2"
kind: mixin
name: context7
displayName: Context7 — Up-to-Date Docs MCP
description: >-
  Registers Upstash's Context7 MCP server (https://github.com/upstash/context7)
  with Claude Code at user scope, over its remote HTTP endpoint, and allows
  egress to mcp.context7.com. Context7 lets the agent pull current,
  version-specific library and framework documentation and code examples
  instead of relying on stale training data. Works anonymously (shared rate
  limit); set CONTEXT7_API_KEY in the sandbox environment for a free key's
  higher limit.
requires:
  agent: claude

# Remote HTTP transport only — no npx/npm involved, so the network surface
# stays to the one host. See README for the local-stdio alternative
# (@upstash/context7-mcp via npx) and why this kit doesn't use it.
permissions:
  network:
    allow:
      - mcp.context7.com

setup:
  install:
    - user: "1000"
      description: Register the context7 MCP server (remote HTTP) with Claude Code at user scope.
      command: |
        set -u

        CLAUDE_DIR="${CLAUDE_CONFIG_DIR:-/home/agent/.claude}"
        export CLAUDE_CONFIG_DIR="$CLAUDE_DIR"
        NAME=context7
        URL=https://mcp.context7.com/mcp

        warn() { echo "context7 kit: $*" >&2; }

        if ! command -v claude >/dev/null 2>&1; then
          warn "WARN: 'claude' not found on PATH; skipping MCP registration."
          exit 0
        fi

        # CONTEXT7_API_KEY is optional: Context7's remote endpoint works
        # anonymously on a shared rate limit. Set the var in the sandbox
        # environment to register with a personal key instead (free, from
        # context7.com/dashboard) for a higher limit.
        if [ -n "${CONTEXT7_API_KEY:-}" ]; then
          out=$(claude mcp add --transport http "$NAME" "$URL" -s user \
            --header "Authorization: Bearer ${CONTEXT7_API_KEY}" 2>&1)
        else
          out=$(claude mcp add --transport http "$NAME" "$URL" -s user 2>&1)
        fi
        status=$?

        # `claude mcp add` exits 1 with "already exists" on a re-run — that's
        # not a failure, just nothing left to do. It does NOT update an
        # already-registered entry's header, so switching in a key later
        # needs a manual `claude mcp remove context7 -s user` first.
        if [ "$status" -eq 0 ]; then
          echo "$out"
        elif echo "$out" | grep -q "already exists"; then
          echo "context7 kit: MCP server '$NAME' already configured in user scope."
        else
          warn "WARN: could not register the '$NAME' MCP server."
          warn "      $out"
          warn "      Retry manually: claude mcp add --transport http $NAME $URL -s user"
        fi
        exit 0

agentInstructions:
  content: |
    ## Context7 MCP available

    The `context7` MCP server is registered at user scope (remote HTTP,
    `https://mcp.context7.com/mcp`), and this sandbox allows egress to
    `mcp.context7.com`. It resolves library/framework names to current,
    version-specific documentation and code examples — use it instead of
    guessing from training data when you need up-to-date API details for a
    dependency (add "use context7" to a prompt, or call its tools directly:
    `resolve-library-id` then `get-library-docs`).

    Running anonymously shares a public rate limit. If `CONTEXT7_API_KEY` was
    set in the sandbox environment at creation time, this kit registered the
    server with that key's `Authorization: Bearer` header instead, for a
    higher limit — get a free key at context7.com/dashboard.

    Check registration with `claude mcp list` or `claude mcp get context7`.
    If it's missing, `claude` may not have been on PATH during setup — retry
    with `claude mcp add --transport http context7 https://mcp.context7.com/mcp -s user`.
