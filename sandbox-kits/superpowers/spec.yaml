schemaVersion: "2"
kind: mixin
name: superpowers
displayName: Superpowers — Skills Library (TDD, Debugging, Collaboration)
description: >-
  Installs the superpowers skills library (brainstorming, planning, TDD,
  systematic debugging, code review) as a Claude Code plugin.
requires:
  agent: claude

permissions:
  network:
    allow:
      - github.com  # git smart-HTTP clones of two public repos; see README

setup:
  install:
    - user: "1000"  # everything written lives under the agent's own ~/.claude
      description: Register the official marketplace and install the superpowers plugin from it.
      command: |
        set -u

        # The official marketplace only auto-registers on an interactive first
        # launch (anthropics/claude-code#66750), so register it here.
        if ! claude plugin marketplace add anthropics/claude-plugins-official; then
          cat >&2 <<'EOF'
        superpowers kit: WARN: could not add the 'claude-plugins-official' marketplace; skipping the install.
          This clones https://github.com/anthropics/claude-plugins-official.git over git smart-HTTP.
          Check whether github.com is reachable: sbx policy log
          Retry in here with: claude plugin marketplace add anthropics/claude-plugins-official
        EOF
          exit 0
        fi

        # Idempotent: reports "already installed" on a second run.
        if ! claude plugin install superpowers@claude-plugins-official; then
          cat >&2 <<'EOF'
        superpowers kit: WARN: could not install 'superpowers' from claude-plugins-official.
          This clones https://github.com/obra/superpowers.git over git smart-HTTP.
          Check whether github.com is reachable: sbx policy log
          Retry in here with: claude plugin install superpowers@claude-plugins-official
        EOF
        fi

        exit 0

agentInstructions:
  content: |
    ## Superpowers skills library installed

    The `superpowers` plugin (`obra/superpowers`, public, via the built-in
    `claude-plugins-official` marketplace) is installed at user scope. Its
    skills are already listed for you by the `Skill` tool, and its SessionStart
    hook injects the `using-superpowers` orientation skill into every session —
    both purely local, no network call. What follows is what those surfaces
    don't tell you.

    The `brainstorming` skill can start a local web server for an interactive
    UI; that page embeds a small `<img>` pointing at `primeradiant.com`, fetched
    by whatever browser opens the page (not by anything running in this
    sandbox), and only when all three of `SUPERPOWERS_DISABLE_TELEMETRY`,
    `DISABLE_TELEMETRY` and `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` are
    unset or set to a falsy value.

    The plugin is third-party code (`obra/superpowers`) installed unpinned at
    whatever version the marketplace currently serves, and its SessionStart
    hook runs on every session. Nothing in this sandbox pins or verifies it.

    If none of the above is present, either the marketplace registration or
    the plugin install could not reach `github.com` — this kit adds exactly
    that one domain. Retry in here with:
    `claude plugin marketplace add anthropics/claude-plugins-official && claude plugin install superpowers@claude-plugins-official`.
