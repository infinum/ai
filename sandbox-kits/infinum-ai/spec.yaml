schemaVersion: "2"
kind: mixin
name: infinum-ai
displayName: Infinum AI Harness — Plugins & Rules
description: >-
  Registers the infinum-ai plugin marketplace, installs four Infinum skill
  plugins, and installs the Infinum house rules into ~/.claude/infinum/.
requires:
  agent: claude

permissions:
  network:
    allow:
      - github.com  # git smart-HTTP clone of the public marketplace repo; see README

setup:
  install:
    - user: "1000"  # everything written lives under the agent's own ~/.claude
      description: Register the infinum-ai marketplace, install the Infinum plugins, and install the house rules into ~/.claude/infinum/.
      command: |
        set -u

        # Exported so later `claude` calls agree with this script even if
        # $HOME differs from /home/agent.
        export CLAUDE_CONFIG_DIR="${CLAUDE_CONFIG_DIR:-/home/agent/.claude}"
        CONFIG_DIR="$CLAUDE_CONFIG_DIR/infinum"
        REPO="infinum/ai"
        MARKET="infinum-ai"
        MARKET_DIR="$CLAUDE_CONFIG_DIR/plugins/marketplaces/$MARKET"
        PLUGINS="stack-essentials create-prd pr-review-code-simplicity productive-debug"

        warn() { echo "infinum-ai kit: $*" >&2; }

        # 1. Register the marketplace. This also leaves a full clone of the
        #    repo at $MARKET_DIR, which step 3 reads. Only steps 2 and 3 need
        #    that clone, so a failure here skips those and nothing else.
        market_ok=1
        if ! claude plugin marketplace add "$REPO"; then
          market_ok=0
          cat >&2 <<EOF
        infinum-ai kit: WARN: could not add the '$MARKET' marketplace; skipping the plugins and the house rules.
          The whoami.md stub, index.md and the CLAUDE.md import line are still written.
          $REPO is public, so this is most likely network policy blocking github.com.
          Check with: sbx policy log
          Then retry in here: claude plugin marketplace add $REPO
        EOF
        fi

        mkdir -p "$CONFIG_DIR"

        if [ "$market_ok" = 1 ]; then
          # 2. Install the plugins — one failure must not cost the other three.
          for p in $PLUGINS; do
            claude plugin install "$p@$MARKET" || \
              warn "WARN: plugin '$p' did not install; retry with: claude plugin install $p@$MARKET"
          done

          # 3. Copy rules out of the clone step 1 made. Flat glob, so rules/<bundle>/
          #    is never descended into; copy-only, so nothing is ever pruned;
          #    whoami.md is skipped so upstream can't clobber it. See README.
          rules_found=0
          for f in "$MARKET_DIR"/rules/*.md; do
            case "${f##*/}" in README.md | whoami.md) continue ;; esac
            [ -f "$f" ] && cp "$f" "$CONFIG_DIR/" && rules_found=1
          done
          [ "$rules_found" = 1 ] || warn "WARN: no house rules found under $MARKET_DIR/rules/."
        fi

        # 4. Local wiring — no network, no clone, so it runs even if step 1 failed.

        # 4a. whoami.md is the user's own: create once, never overwrite.
        if [ ! -f "$CONFIG_DIR/whoami.md" ]; then
          cat > "$CONFIG_DIR/whoami.md" <<'WHOAMI'
        # Who you're working with

        > Replace this with your name and role so Claude can calibrate
        > its responses. Example:
        >
        > "Senior backend engineer at Infinum, focused on payments.
        > Comfortable with Go and Postgres; new to the iOS codebase."
        WHOAMI
        fi

        # 4b. index.md, regenerated in the installer's order: whoami first, then
        #     every rule alphabetically. It must never import itself.
        {
          echo "@$CONFIG_DIR/whoami.md"
          for f in "$CONFIG_DIR"/*.md; do
            case "${f##*/}" in whoami.md | index.md) continue ;; esac
            [ -f "$f" ] && echo "@$f"
          done
        } > "$CONFIG_DIR/index.md"

        # 4c. One import line in CLAUDE.md, appended only when absent. The
        #     leading newline both terminates a file that lacks a trailing one
        #     and keeps the line off the end of the user's own last line.
        grep -qsF "@$CONFIG_DIR/index.md" "$CLAUDE_CONFIG_DIR/CLAUDE.md" ||
          printf '\n%s\n' "@$CONFIG_DIR/index.md  # managed by $REPO" >> "$CLAUDE_CONFIG_DIR/CLAUDE.md"

        exit 0

agentInstructions:
  content: |
    ## Infinum AI Harness installed

    The `infinum-ai` plugin marketplace (`infinum/ai`) is registered and these
    plugins are installed at user scope:

    - `stack-essentials` — SessionStart update-banner hook; its check gates on
      `~/.claude/infinum/.manifest.json`, which this kit never writes, so the
      banner never fires here.
    - `create-prd` — generate a Product Requirements Document.
    - `pr-review-code-simplicity` — review a PR through the six laws of software
      design.
    - `productive-debug` — investigate a Productive bug task end-to-end.

    Nine other marketplace plugins are **not** installed — some need local
    tooling or egress this sandbox lacks, the rest are design-side and out of
    scope here; the kit README lists each with its reason. Install one anyway
    with `claude plugin install <name>@infinum-ai`, or browse with `/plugin`.

    House rules are installed at `~/.claude/infinum/`, chained from `index.md`,
    which `~/.claude/CLAUDE.md` imports.

    `~/.claude/infinum/whoami.md` may still be the unedited stub. If it is, it
    tells you nothing real about the user — do not treat its placeholder example
    as fact.

    `infinum/ai` is public. If `whoami.md` and `index.md` exist but the plugins
    and the copied rules do not, the install could not reach it — most likely
    network policy blocking `github.com` (check with `sbx policy log`). Retry in
    here with `claude plugin marketplace add infinum/ai`, then re-install the
    four plugins listed above.
