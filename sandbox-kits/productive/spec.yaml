schemaVersion: "2"
kind: mixin
name: productive
displayName: Productive — Project Management MCP
description: >-
  Registers Productive's MCP server with Claude Code at user scope, so the
  agent can read and update projects, tasks, time entries, deals and invoices.
  Registration only — the per-user OAuth login is a manual step afterwards.
requires:
  agent: claude

permissions:
  network:
    allow:
      - mcp.productive.io  # the remote HTTP MCP endpoint
      - app.productive.io  # OAuth authorize/consent page `claude mcp login` opens; see README

setup:
  install:
    - user: "1000"  # everything written lives under the agent's own ~/.claude
      description: Register the productive MCP server (remote HTTP) with Claude Code at user scope.
      command: |
        set -u

        # Exported so `claude` agrees with this script even if $HOME differs
        # from /home/agent.
        export CLAUDE_CONFIG_DIR="${CLAUDE_CONFIG_DIR:-/home/agent/.claude}"
        NAME=productive
        URL=https://mcp.productive.io/mcp

        # Registration only — OAuth login is interactive and per Productive
        # user, so it cannot happen during unattended setup. See README.
        out=$(claude mcp add --transport http "$NAME" "$URL" -s user 2>&1)
        status=$?

        # `claude mcp add` exits 1 with "already exists" on a re-run — that's
        # not a failure, just nothing left to do.
        if [ "$status" -eq 0 ]; then
          echo "$out"
        elif echo "$out" | grep -q "already exists"; then
          echo "productive kit: MCP server '$NAME' already configured in user scope."
        else
          cat >&2 <<EOF
        productive kit: WARN: could not register the '$NAME' MCP server.
          $out
          Retry in here: claude mcp add --transport http $NAME $URL -s user
        EOF
        fi

        exit 0

agentInstructions:
  content: |
    ## Productive MCP registered — authorization still needed

    The `productive` MCP server is registered at user scope (remote HTTP,
    `https://mcp.productive.io/mcp`), and this sandbox allows egress to
    `mcp.productive.io` and `app.productive.io`. Once authorized, it can read
    and update Productive projects/tasks, time entries, CRM deals and
    contacts, resource bookings, and invoices/expenses.

    Registration alone does not connect it — Productive's MCP server uses
    per-user OAuth 2.0, so a human has to complete a one-time login:

    - Interactively (a browser is reachable from this session): `claude mcp
      login productive`
    - Headless/SSH-style session: `claude mcp login productive --no-browser`,
      then open the printed URL in any browser, sign in to Productive, and
      paste the resulting redirect URL back when prompted.

    Requirements on the Productive side: the account must be on the
    **Ultimate** plan with AI features enabled, and the login authorizes
    exactly one Productive organization per connection (switching orgs means
    `claude mcp logout productive` and logging in again).

    Check status with `claude mcp get productive` — `⏸ Pending approval` or an
    auth error means the login step above still needs to happen. If the login
    page itself fails to load, egress to `app.productive.io` may be blocked —
    check `sbx policy log`.
