schemaVersion: "2"
kind: mixin
name: claude-no-attribution
displayName: Claude Code — No Attribution
description: >-
  Removes Claude Code's "🤖 Generated with Claude Code" commit trailer and
  "Co-Authored-By: Claude" line, leaving every other ~/.claude/settings.json
  key intact.
requires:
  agent: claude

setup:
  install:
    - user: "1000"  # everything written lives under the agent's own ~/.claude
      description: Set attribution.commit and attribution.pr to "" in ~/.claude/settings.json to disable Claude's commit/PR attribution.
      command: |
        set -eu
        f=/home/agent/.claude/settings.json
        mkdir -p "$(dirname "$f")"
        # -s, not -f: a zero-byte settings.json passes -f, and `jq` on empty
        # input exits 0 with empty output, so the write below would replace the
        # file with a bare newline and still report success.
        [ -s "$f" ] || echo '{}' > "$f"
        # Capture before writing: a jq failure aborts before "$f" is touched,
        # and writing in place keeps the file's own mode and owner.
        merged=$(jq '.attribution.commit = "" | .attribution.pr = ""' "$f")
        printf '%s\n' "$merged" > "$f"

agentInstructions:
  content: |
    ## Commit & PR attribution disabled

    This sandbox sets `attribution.commit` and `attribution.pr` to empty
    strings in `~/.claude/settings.json`. Commits and pull requests you
    create will not include the "🤖 Generated with Claude Code" trailer or
    the "Co-Authored-By: Claude" line.
